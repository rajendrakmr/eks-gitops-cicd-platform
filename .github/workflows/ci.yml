name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ test (one job per language/service)
  auth-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/auth-service } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: services/auth-service/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  api-gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api-gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: services/api-gateway/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  product-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/product-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go mod tidy
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  order-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/order-service } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/order-service/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env: { REDIS_URL: "redis://localhost:6379" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: /api }

  # ------------------------------------------------------------------ infrastructure-as-code validation
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile monitoring config -q
      - name: kubeconform (Kubernetes manifests)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s | ./kubeconform -strict -summary -kubernetes-version 1.30.0

  # ------------------------------------------------------------------ build + publish images (main / tags only)
  images:
    if: github.event_name == 'push'
    needs: [auth-service, api-gateway, product-service, order-service, frontend, validate-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service,    context: services/auth-service }
          - { name: api-gateway,     context: services/api-gateway }
          - { name: product-service, context: services/product-service }
          - { name: order-service,   context: services/order-service }
          - { name: frontend,        context: frontend }
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/shopstream-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Vulnerability scan (report only; flip exit-code to 1 to gate releases)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/shopstream-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  # ------------------------------------------------------------------ deploy to Kubernetes (opt-in)
  # Enable with repository variable DEPLOY_ENABLED=true and secret KUBE_CONFIG (base64-encoded kubeconfig).
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    environment: production # add required reviewers on this environment for a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Pin images to this commit
        working-directory: k8s
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in auth-service product-service order-service api-gateway frontend; do
            kustomize edit set image "ghcr.io/OWNER/shopstream-${svc}=ghcr.io/${OWNER}/shopstream-${svc}:${GITHUB_SHA}"
          done
      - name: Apply
        run: kubectl apply -k k8s
      - name: Wait for rollouts
        run: |
          for d in auth-service product-service order-service api-gateway frontend; do
            kubectl -n shopstream rollout status deployment/$d --timeout=300s
          done
      - name: Roll back on failure
        if: failure()
        run: |
          for d in auth-service product-service order-service api-gateway frontend; do
            kubectl -n shopstream rollout undo deployment/$d || true
          done
