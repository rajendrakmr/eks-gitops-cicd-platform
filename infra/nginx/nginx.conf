# Edge proxy: same-origin entry point for the browser.
#   /api/*  -> gateway (all replicas)      /  -> Next.js frontend
# Docker's embedded DNS (127.0.0.11) returns every replica of a scaled service; using variables in
# proxy_pass makes nginx re-resolve them, so `docker compose up --scale gateway=3` just works.
worker_processes auto;
events { worker_connections 2048; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  include /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
  gzip_min_length 1024;

  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time up=$upstream_addr';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /api/ {
      set $gateway http://gateway:8080;
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
