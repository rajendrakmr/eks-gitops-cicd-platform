# auth-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: { app: auth-service, tier: backend }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service, tier: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: auth-service }
      containers:
        - name: auth-service
          image: ghcr.io/OWNER/shopstream-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4001 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "4001" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: JWT_SECRET } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: POSTGRES_PASSWORD } } }
            - { name: ADMIN_EMAIL, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: ADMIN_EMAIL } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: ADMIN_PASSWORD } } }
            - { name: DATABASE_URL, value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/auth_db" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }   # native sleep action (k8s >= 1.30): lets endpoints drain before SIGTERM; works on distroless
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels: { app: auth-service }
spec:
  selector: { app: auth-service }
  ports:
    - { name: http, port: 4001, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:   { stabilizationWindowSeconds: 0,   policies: [{ type: Percent, value: 100, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods,    value: 1,   periodSeconds: 60 }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: auth-service }
