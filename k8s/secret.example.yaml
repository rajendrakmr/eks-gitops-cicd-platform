# Copy to k8s/secret.yaml (git-ignored), fill in real values, then:  kubectl apply -f k8s/secret.yaml
# Better for production: External Secrets Operator / Sealed Secrets / your cloud secret manager.
#
#   JWT_SECRET         openssl rand -hex 32
#   POSTGRES_PASSWORD  openssl rand -hex 16   (hex only: it is embedded in connection URLs)
apiVersion: v1
kind: Secret
metadata:
  name: shopstream-secrets
  namespace: shopstream
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_WITH_64_HEX_CHARS"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_32_HEX_CHARS"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "REPLACE_ME_STRONG_PASSWORD"
