global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

# dns_sd (type A) returns one target per replica, so `--scale` is picked up automatically.
scrape_configs:
  - job_name: gateway
    dns_sd_configs: [{ names: [gateway], type: A, port: 8080 }]
  - job_name: auth-service
    dns_sd_configs: [{ names: [auth-service], type: A, port: 4001 }]
  - job_name: product-service
    dns_sd_configs: [{ names: [product-service], type: A, port: 4002 }]
  - job_name: order-service
    dns_sd_configs: [{ names: [order-service], type: A, port: 4003 }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
