groups:
  - name: shopstream
    rules:
      - alert: ServiceDown
        expr: up{job!="prometheus"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} instance {{ $labels.instance }} is down"

      - alert: GatewayHighErrorRate
        expr: |
          sum(rate(gateway_http_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(gateway_http_request_duration_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of gateway responses are 5xx"

      - alert: GatewaySlowP95
        expr: histogram_quantile(0.95, sum(rate(gateway_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Gateway p95 latency above 1s"

      - alert: ProductCacheHitRatioLow
        expr: |
          sum(rate(product_cache_requests_total{result="hit"}[10m]))
            / clamp_min(sum(rate(product_cache_requests_total[10m])), 0.001) < 0.5
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Product cache hit ratio below 50%"
